services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: envvault
      POSTGRES_PASSWORD: envvault
      POSTGRES_DB: envvault
    ports:
      - "5432:5432"
    volumes:
      - envvault_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envvault -d envvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  envvault_pg:
